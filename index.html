<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>DOHYEON CALENDAR</title>
  <meta name="description" content="도현의 방송 기록과 다시보기를 모아 보는 팬 아카이브 달력">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="도현 달력 처음으로">
        <span class="brand-mark">D</span>
        <span><strong>DOHYEON</strong><small>BROADCAST ARCHIVE</small></span>
      </a>
      <div class="top-note">SINCE AUGUST 2024</div>
    </header>

    <section class="calendar-panel" aria-label="방송 달력">
      <div class="calendar-heading">
        <div class="month-title"><h1 id="monthLabel">2024년 8월</h1><span id="yearLabel">ARCHIVE</span></div>
        <div class="month-controls">
          <button id="todayBtn" class="control-btn" type="button">오늘</button>
          <button id="prevBtn" class="control-btn arrow" type="button" aria-label="이전 달">‹</button>
          <button id="nextBtn" class="control-btn arrow" type="button" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="legend" aria-label="기록 종류">
        <span><i class="dot regular"></i> 정규방송</span>
        <span><i class="dot collab"></i> 합방·콘텐츠</span>
        <span><i class="dot break"></i> 휴방</span>
        <span><i class="dot special"></i> 기념일</span>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <footer class="calendar-footer"><span>DOHYEON ARCHIVE</span><span>CLICK A DATE TO EXPLORE</span></footer>
    </section>
    <p class="site-credit">개인 팬 아카이브 · 기록과 이미지의 권리는 각 원저작자에게 있습니다.</p>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="close-btn" type="button" aria-label="닫기">×</button>
      <div class="modal-eyebrow">DAH / REPLAY COLLECTION</div>
      <h2 id="modalTitle">날짜 · 방송 기록</h2>
      <p id="modalDescription" class="modal-description">보고 싶은 영상을 선택하면 다시보기로 이동합니다.</p>
      <div id="replayList" class="replay-list"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
